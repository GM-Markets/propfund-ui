# PropFund / Vanta UI — one stack per DEPLOY_ENV on the same host.
# Example:
#   DEPLOY_ENV=dev  V3_APP_PORT=5711 docker compose up -d --build
#   DEPLOY_ENV=pvt  V3_APP_PORT=5611 docker compose up -d --build
#   DEPLOY_ENV=prod V3_APP_PORT=5411 docker compose up -d --build
#
# Defaults (when V3_APP_PORT unset) are applied by scripts/deploy.sh.

name: propfund-${DEPLOY_ENV:-dev}

services:
  propfund:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:5711}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://gate.propfund.io}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-PropFund}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_CLIENT_ID: ${NEXT_PUBLIC_PRIVY_CLIENT_ID:-}
        NEXT_PUBLIC_HYPERLIQUID_WS_URL: ${NEXT_PUBLIC_HYPERLIQUID_WS_URL:-wss://api.hyperliquid.xyz/ws}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: propfund-${DEPLOY_ENV:-dev}
    image: propfund-${DEPLOY_ENV:-dev}:latest
    ports:
      - "${V3_APP_PORT:-5711}:${V3_APP_PORT:-5711}"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${V3_APP_PORT:-5711}
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://gate.propfund.io}
      VANTA_API_BASE_URL: ${VANTA_API_BASE_URL:-https://gate.propfund.io/van}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'5711')).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
