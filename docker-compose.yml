# Propfund app: production compose stack.
# Env is loaded from `.env` (see `.env.example`).
#
# Deploy: ./deploy.sh

name: propfund

services:
  app:
    container_name: propfund-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_CLIENT_ID: ${NEXT_PUBLIC_PRIVY_CLIENT_ID:-}
        NEXT_PUBLIC_PAYOUT_WALLET_ARBITRUM: ${NEXT_PUBLIC_PAYOUT_WALLET_ARBITRUM:-}
        NEXT_PUBLIC_TREASURY_ADDRESSES: ${NEXT_PUBLIC_TREASURY_ADDRESSES:-}
    image: propfund-app:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
