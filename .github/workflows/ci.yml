name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders so `next build` doesn't fail on missing env.
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:5400
          VANTA_API_BASE_URL: http://localhost:5400/van
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_PRIVY_APP_ID: ci_placeholder

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:5400
          VANTA_API_BASE_URL: http://localhost:5400/van
          NEXT_PUBLIC_PRIVY_APP_ID: ci_placeholder
